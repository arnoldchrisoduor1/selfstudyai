# API + static web + static landing, behind Nginx.
# Edge: http://localhost:8088
#   /            landing
#   /app/        product app
#   /healthz     api
#
# Default (below): SQLite on the study_data volume — unchanged local-first default.
# Cloud / multi-user: set DATABASE_URL to Postgres on the api service, e.g.
#   DATABASE_URL: postgres://USER:PASS@HOST:5432/selfstudy?sslmode=disable
# Use the same migration chain as local SQLite (001 … 005_accounts_sync).

services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: study-api
    environment:
      APP_ENV: production
      RUST_LOG: info
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      DATABASE_URL: sqlite:///data/selfstudy.db?mode=rwc
      CORS_ORIGINS: ""
    volumes:
      - study_data:/data
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: study-web
    expose:
      - "80"
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: infra/Dockerfile.landing
    container_name: study-landing
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: study-nginx
    ports:
      - "8088:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - landing
    restart: unless-stopped

volumes:
  study_data:
